name: Auto Publish Blog Post

on:
  push:
    branches: [main]
    paths:
      - 'src/data/posts.ts'  # only triggers when blog data changes
  workflow_dispatch:        # allows manual testing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Extract latest blog post
        id: extract
        run: python scripts/extract_latest_post.py
        env:
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Post to Telegram
        if: steps.extract.outputs.post_found == 'true'
        run: python scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_TITLE: ${{ steps.extract.outputs.post_title }}
          POST_SLUG: ${{ steps.extract.outputs.post_slug }}
          POST_EXCERPT: ${{ steps.extract.outputs.post_excerpt }}
          POST_CATEGORY: ${{ steps.extract.outputs.post_category }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Post to Dev.to
        if: steps.extract.outputs.post_found == 'true'
        run: python scripts/post_devto.py
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          POST_TITLE: ${{ steps.extract.outputs.post_title }}
          POST_SLUG: ${{ steps.extract.outputs.post_slug }}
          POST_EXCERPT: ${{ steps.extract.outputs.post_excerpt }}
          POST_CATEGORY: ${{ steps.extract.outputs.post_category }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Send Brevo newsletter
        if: steps.extract.outputs.post_found == 'true'
        run: python scripts/send_newsletter.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          POST_TITLE: ${{ steps.extract.outputs.post_title }}
          POST_SLUG: ${{ steps.extract.outputs.post_slug }}
          POST_EXCERPT: ${{ steps.extract.outputs.post_excerpt }}
          POST_CATEGORY: ${{ steps.extract.outputs.post_category }}
          POST_READ_TIME: ${{ steps.extract.outputs.post_read_time }}
          SITE_URL: ${{ secrets.SITE_URL }}
