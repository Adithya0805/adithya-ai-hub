<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECD7" />
      <stop offset="40%" stop-color="#C8A96E" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
    <linearGradient id="facet-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2418" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield -->
  <polygon points="50,6 92,28 92,72 50,94 8,72 8,28" fill="#0C0C0D" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Left Leg of A -->
  <path d="M 50,18 L 24,78 L 33,78 L 43,54 L 50,54" fill="url(#facet-fill)" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Right Leg of A -->
  <path d="M 50,18 L 76,78 L 67,78 L 57,54 L 50,54" fill="url(#gold-grad)" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.95" />

  <!-- Apex Prism -->
  <polygon points="50,18 43,36 57,36" fill="#FFE8B2" />

  <!-- Central Intelligence Node -->
  <polygon points="50,42 61,56 50,59 39,56" fill="#C8A96E" stroke="#0C0C0D" stroke-width="1.5" />
  <circle cx="50" cy="53" r="3.5" fill="#FFFFFF" />
  <circle cx="50" cy="84" r="2.5" fill="url(#gold-grad)" />
</svg>
